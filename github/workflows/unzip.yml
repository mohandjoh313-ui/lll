name: Extract index.zip

on:
  workflow_dispatch:

jobs:
  unzip:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Extract index.zip
        run: |
          if [ ! -f "index.zip" ]; then
            echo "ERROR: index.zip was not found!"
            echo "Repository files:"
            ls -la
            exit 1
          fi

          mkdir -p index

          unzip -o "index.zip" -d "index"

          echo "DONE!"
          echo "index.zip is still موجود."
          echo "Extracted files:"
          find index -maxdepth 3 -type f

      - name: Save to GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add index

          git commit -m "Extract index.zip" || echo "Nothing to commit"

          git push
