name: Unzip ZIP

on:
  workflow_dispatch:

jobs:
  unzip:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find ZIP file
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found in repository root."
            exit 1
          fi

          echo "Found ZIP: $ZIP_FILE"
          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Extract ZIP into folder
        run: |
          ZIP_NAME=$(basename "$ZIP_FILE")
          FOLDER_NAME="${ZIP_NAME%.*}"

          echo "Creating folder: $FOLDER_NAME"

          mkdir -p "$FOLDER_NAME"

          unzip -o "$ZIP_FILE" -d "$FOLDER_NAME"

          echo "Extraction completed."

      - name: Save changes to GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          git commit -m "Extract ZIP files" || echo "Nothing new to commit"

          git push
