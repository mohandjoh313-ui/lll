name: Unzip ZIP

on:
  workflow_dispatch:

jobs:
  unzip:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find ZIP file
        shell: bash
        run: |
          echo "Searching for ZIP files..."

          ZIP_FILE=$(find . -type f \( -iname "*.zip" \) \
            -not -path "./.git/*" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found anywhere in the repository."
            echo "Files in repository:"
            find . -maxdepth 3 -type f
            exit 1
          fi

          echo "ZIP FOUND:"
          echo "$ZIP_FILE"

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Extract ZIP
        shell: bash
        run: |
          ZIP_NAME=$(basename "$ZIP_FILE")
          ZIP_DIR=$(dirname "$ZIP_FILE")
          FOLDER_NAME="${ZIP_NAME%.*}"

          OUTPUT_DIR="$ZIP_DIR/$FOLDER_NAME"

          echo "ZIP: $ZIP_FILE"
          echo "OUTPUT: $OUTPUT_DIR"

          mkdir -p "$OUTPUT_DIR"

          unzip -o "$ZIP_FILE" -d "$OUTPUT_DIR"

          echo ""
          echo "Extraction completed."
          echo "ZIP remains untouched."

      - name: Commit extracted files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Extract ZIP files"
            git push
          fi
